[project]
name = "crew-ai-experiment-1"
version = "0.1.0"
description = "CrewAI multi-agent learning experiments (uv-managed)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[anthropic,tools]>=1.15.30,<2.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# CrewAI's own internals emit DeprecationWarnings; hide them so test output stays readable.
filterwarnings = ["ignore::DeprecationWarning:crewai"]
